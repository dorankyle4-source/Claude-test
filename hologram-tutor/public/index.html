<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hologram Tutor</title>
    <link rel="stylesheet" href="/styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "/vendor/three/build/three.module.js",
          "three/addons/": "/vendor/three/addons/"
        }
      }
    </script>
    <script type="module" src="/js/app.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <h1>Hologram Tutor</h1>
        <span id="model-label" class="muted"></span>
      </div>
      <div class="controls">
        <label class="toggle" title="Read answers aloud">
          <input id="speech-toggle" type="checkbox" />
          <span>Voice</span>
        </label>
        <select id="voice-select" aria-label="Voice"></select>
        <button id="new-conversation" type="button" class="secondary">New conversation</button>
      </div>
    </header>

    <div id="banner" class="banner" role="alert" hidden></div>

    <main class="layout">
      <section class="stage" aria-label="Tutor">
        <div id="character" class="character"></div>
        <div class="stage-caption">
          <strong id="character-name">Tutor</strong>
          <span id="character-state" class="state-chip" data-state="idle">Ready</span>
        </div>
      </section>

      <section class="chat" aria-label="Conversation">
        <ol id="log" class="log" aria-live="polite"></ol>
        <form id="composer" class="composer">
          <textarea
            id="input"
            rows="2"
            placeholder="Ask anything — e.g. “Explain eigenvalues like I'm an engineer”"
            aria-label="Your question"
          ></textarea>
          <button id="send" type="submit">Send</button>
          <button id="stop" type="button" class="danger" hidden>Stop</button>
        </form>
        <p class="hint muted">Enter to send · Shift+Enter for a new line · Esc to stop</p>
      </section>
    </main>
  </body>
</html>
